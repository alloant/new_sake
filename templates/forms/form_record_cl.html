<form class="custom-card p-5" hx-post="/modify_record_cl?record_id={{record.id}}&loop_index={{loop.index}}&section={{section}}&panel={{panel}}" hx-target="#row-{{record.id}}" method="POST">
    <div class="level mb-5">
        <div class="level-left">
            <div>
                <h2 class="title is-4 mb-0">Record {{ record.protocol }}</h2>
            </div>
        </div>
        <div class="level-right">
            <div class="buttons">
                <button type="button" class="button is-light" onclick="closeModal()">Cancel</button>
                
                <button class="button is-link" name="submit_form" value="save" onclick="closeModal()">
                    <span class="iconify mr-1" data-icon="mdi-content-save"></span> Save
                </button>
                
                {% if action == 'sign_note' and status and not status.params['dispatcher_signature'] %}
                <button class="button is-link" name="submit_form" value="save_sign" onclick="closeModal()">
                    <span class="iconify mr-1" data-icon="mdi-content-save-edit"></span> Save & Sign
                </button>
                {% endif %}
            </div>
        </div>
    </div>
    
    <div class="columns is-variable is-5 is-align-items-stretch">
        <div class="column is-8 is-flex is-flex-direction-column">
            <div class="columns is-mobile">
                <div class="column is-3">
                    <label class="label is-small">Sequence</label>
                    <input class="input" type="text" name="sequence" value="{{record.sequence}}">
                </div>
                <div class="column is-3">
                    <label class="label is-small">Year</label>
                    <input class="input" type="text" name="year" value="{{record.year}}">
                </div>
                <div class="column is-6">
                    <label class="label is-small">Tags</label>
                    <div class="dropdown is-hoverable is-block">
                        <div class="dropdown-trigger">
                            <button class="button is-fullwidth is-justify-content-space-between" type="button">
                                <span>Select Tags</span>
                                <span class="icon is-small"><i class="iconify" data-icon="mdi:chevron-down"></i></span>
                            </button>
                        </div>
                        <div class="dropdown-menu" style="width: 100%;">
                            <div class="dropdown-content" style="max-height: 200px; overflow-y: auto;">
                                {% for tag in tags %}
                                <label class="dropdown-item">
                                    <input type="checkbox" name="tag_ids" value="{{ tag }}" {{ 'checked' if tag in record.tags }} class="mr-2">
                                    {{ tag }}
                                </label>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="field mt-4">
                <label class="label is-small">Title</label>
                <textarea class="textarea" name="title" rows="2">{{record.title}}</textarea>
            </div>
            <div class="field is-flex-grow-1 is-flex is-flex-direction-column">
                <label class="label is-small">Comments</label>
                <div class="control is-flex-grow-1 is-flex">
                    <textarea class="textarea" name="comments" placeholder="Add comments..." style="flex-grow: 1; resize: none;"></textarea>
                </div>
            </div>
        </div>

        <div class="column is-4">
            <div class="field">
                <label class="label is-small">Assign ctr</label>
                {% include "forms/select_targets.html" %}
            </div>
        </div>
    </div>
</form>


<script>
    // 1. Wrap the initialization in a reusable function
    function initSortable() {
        const el = document.getElementById('listWithHandle');
        if (el) {
            // Check if it's already been initialized to avoid duplicates
            if (el.sortableInstance) {
                el.sortableInstance.destroy();
            }

            el.sortableInstance = Sortable.create(el, {
                handle: '.handle-move',
                ghostClass: 'blue-background-class',
                animation: 150,
                forceFallback: true,
                fallbackClass: 'sortable-fallback'
            });
        }
    }

    // 2. Run on initial page load
    document.addEventListener('DOMContentLoaded', initSortable);

    // 3. CRITICAL: Run after HTMX swaps any content
    document.addEventListener('htmx:afterSwap', function(event) {
        initSortable();
    });

    // --- Your Existing Checkbox Logic ---
    let autoSelectDone = false;
    document.addEventListener('change', function(event) {
        if (event.target.classList.contains('target-checkbox') && event.target.checked) {
            const deptSelect = document.getElementById('dept-select');
            const targetDept = event.target.getAttribute('data-dept');

            if (!autoSelectDone && deptSelect && !deptSelect.value && targetDept) {
                for (let i = 0; i < deptSelect.options.length; i++) {
                    if (deptSelect.options[i].value === targetDept) {
                        deptSelect.selectedIndex = i;
                        autoSelectDone = true;
                        deptSelect.parentElement.classList.add('is-success');
                        setTimeout(() => deptSelect.parentElement.classList.remove('is-success'), 1000);
                        break;
                    }
                }
            }
        }
    });
</script>
