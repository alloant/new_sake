<form class="box" hx-post="/modify_record?record_id={{record.id}}&loop_index={{loop.index}}" hx-target="#row-{{record.id}}" method="POST">
  <div class="field is-grouped is-grouped-right">
    {% if action == 'sign_note' and not status.params['dispatcher_signature'] %}
    <div class="control">
      <button class="button is-link" name="submit_form" value="save_sign" onclick="closeModal()">Save and sign</button>
    </div>
    {% endif %}
    <div class="control">
      <button class="button is-link" name="submit_form" value="save" onclick="closeModal()">Save</button>
    </div>
    <div class="control">
      <button class="button is-link is-light" onclick="closeModal()">Cancel</button>
      </div>
  </div>

  <div class="columns p-2">
    <div class="column">
      <div class="field is-grouped is-fullwidth">
        <div class="control">
          <label class="label">Flow</label>
          <div class="select" name="flow">
            <select>
              <option {{ 'selected' if record.flow.value == 'inbound' else '' }} value="inbound">Inbound</option>
              <option {{ 'selected' if record.flow.value == 'outbound' else '' }} value="outbound">Outbound</option>
              <option {{ 'selected' if record.flow.value == 'internal_cr' else '' }} value="internal_cr">Internal cr</option>
              <option {{ 'selected' if record.flow.value == 'internal_cl' else '' }} value="internal_cl">Internal cl</option>
            </select>
          </div>
        </div>

        <div class="control">
                <label class="label">Register{{record.register.alias}}</label>
          <div class="select">
            <select name="register" hx-get="/record_form_data?info=senders_{{record.sender.alias}}_{{record.flow.value}}_" hx-target="#form_record_senders">
                  <option {{ 'selected' if record.register.alias == '' else '' }}></option>
              {% for register in registers %}
                  <option {{ 'selected' if record.register.alias == register else '' }}>{{ register }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
        
        <div class="control is-expanded">
          <label class="label">Sender</label>
          <div class="select is-success" name="sender">
            <select id="form_record_senders">
                <option {{ 'selected' if record.sender.alias == 'a' else '' }}></option>
              {% for sender in senders %}
                <option {{ 'selected' if record.sender.alias == sender.alias else '' }} value="{{sender.alias}}">{{sender.alias}}</option>
              {% endfor %}
            </select>
          </div>
        </div>
       
        <div class="control" style="width: 5em;">
          <label class="label">Sequence</label>
          <input class="input" type="text"  name="sequence" placeholder="1234" value="{{record.sequence}}">
        </div>
        
        <div class="control" style="width: 4em;">
          <label class="label">Year</label>
          <input class="input" type="text"  name="year" placeholder="2026" value="{{record.year}}">
        </div>
      </div>

      <div class="field is-grouped is-fullwidth">
        
        <div class="control">
          <label class="label">Tags</label>
          <div class="dropdown is-hoverable is-block">
            <div class="dropdown-trigger" style="width: 100%;">
              <button class="button is-fullwidth is-justify-content-space-between" aria-haspopup="true" aria-controls="dropdown-menu-tags" type="button">
                <span>Select Tags...</span>
                <span class="icon is-small">
                  <i class="iconify" data-icon="mdi:chevron-down"></i>
                </span>
              </button>
            </div>
            
            <div class="dropdown-menu" id="dropdown-menu-tags" role="menu" style="width: 100%;">
              <div class="dropdown-content" style="max-height: 200px; overflow-y: auto;">
                {% for tag in tags %}
                <label class="dropdown-item">
                  <input type="checkbox" name="audience" value="{{ tag.id }}" {{ 'checked' if tag in record.tags else '' }} class="mr-2">
                  {{ tag.title }}
                </label>
                {% endfor %}
              </div>
            </div>
          </div>
        </div>

        <div class="control">
          <label class="label">Audience</label>
          <div class="select">
            <select name="audience">
                <option {{ 'selected' if record.audience == 'all' else '' }}>All</option>
                <option {{ 'selected' if record.audience == 'dr' else '' }}>Only dr</option>
                <option {{ 'selected' if record.audience == 'permanent' else '' }}>Only permanent</option>
            </select>
          </div>
        </div>

        <div class="control">
          <label class="label">Department</label>
          <div class="select">
            <select name="department">
              {% for department in departments %}
                  <option {{ 'selected' if department == record.unit.alias else '' }}>{{ department }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      
      </div>

      <div class="field">
        <label class="label">Title</label>
        <div class="control">
            <textarea class="textarea" name="title" placeholder="Title">{{record.title}}</textarea>
        </div>
      </div>

      <div class="field">
        <label class="label">Comments</label>
        <div class="control">
            <textarea class="textarea" name="comments" placeholder="Textarea"></textarea>
        </div>
      </div>
    </div>

    <div class="column is-4">
      <div class="field">
        <div class="control">
          <label class="label">Targets</label>
          {% include "forms/select_targets.html" %}
        </div>
      </div>
    </div>
  </div>
</form>

<script>
    Sortable.create(listWithHandle, {
      handle: '.handle-move',
      ghostClass: 'blue-background-class',
      animation: 150,
      forceFallback: true,
      fallbackClass: 'sortable-fallback'
    });
</script>
