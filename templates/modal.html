<div id="modal-container" class="modal">
  <div class="modal-background" onclick="closeModal()"></div>

  <div id="modal-content-target" class="modal-content">
    <div  class="">
    </div>
  </div>
</div> <!-- End modal container -->

<script>
  function openModal() {
    document.getElementById('modal-container').classList.add('is-active');
  }  

  function closeModal() {
    document.getElementById('modal-container').classList.remove('is-active');
  }
</script>
