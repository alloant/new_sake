<div class="columns m-0 p-0" style="border-bottom: 0.5px solid #555555;">
  <div class="column is-2 p-2" style="gap: 1rem;"> <!-- here first 3 columns -->
    <span><abbr title="Status">#</abbr></span>
    <span><abbr title="Department"></abbr></span>
    <span><abbr title="Protocol"></abbr></span>
  </div>

  <div class="column is-8 p-2">
    <span>Title</span>
  </div>
  <div class="column is-2 p-2 has-text-right">
    <span>Date</span>
  </div>
</div> <!-- End of columns -->

{% for record, status in records %}
  <div class="columns is-mobile is-multiline is-gapless">
      <div class="column is-half-mobile is-one-third-desktop has-order-1-mobile">
    <div class="notification is-primary">C1 (ID/Icon)</div>
  </div>

  <div class="column is-full-mobile is-one-third-desktop has-order-3-mobile">
    <div class="notification is-info">C2 (The Long Title)</div>
  </div>

  <div class="column is-half-mobile is-one-third-desktop has-order-2-mobile">
    <div class="notification is-success">C3 (Action/Date)</div>
  </div>
  </div>
{% endfor %}
