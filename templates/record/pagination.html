<!-- 1. Removed .pagination and .pagination-list. Added is-flex and mb-0 -->
<div id="pagination-table" class="is-flex is-align-items-center mb-0">
  
  <!-- 2. The Text: Use is-size-7 to match the "is-small" button scale -->
  <span class="px-3 is-size-7" style="white-space: nowrap;">
    {{pagination['first']}} - {{pagination['last']}} of {{num_records}}
  </span> 

  <!-- 3. The Buttons: Wrapped in a field with mb-0 to kill the default bottom margin -->
  <div class="field has-addons mb-0">
    <div class="control">
      {% if pagination['prev'] != None %}
        <button class="button is-small px-2"
            {% if search %}
              hx-post="/records/table?last_search={{search}}&page={{pagination['prev']}}&section={{section}}&panel={{panel}}"
            {% else %}
              hx-post="/records/table?page={{pagination['prev']}}&section={{section}}&panel={{panel}}"
            {% endif %}
            hx-target="#main-table"
            hx-indicator="#progress-indicator"
            hx-include="#advanced-search-form">
          <span class="icon is-small"><i class="iconify" data-icon="mdi-chevron-left"></i></span>
        </button>
      {% else %}
        <button class="button is-small px-2" disabled>
          <span class="icon is-small"><i class="iconify" data-icon="mdi-chevron-left"></i></span>
        </button>
      {% endif %}
    </div>

    <div class="control">
      {% if pagination['next'] != None %}
        <button class="button is-small px-2"
            {% if search %}
              hx-post="/records/table?last_search={{search}}&page={{pagination['next']}}&section={{section}}&panel={{panel}}"
            {% else %}
              hx-post="/records/table?page={{pagination['next']}}&section={{section}}&panel={{panel}}"
            {% endif %}
            hx-target="#main-table"
            hx-indicator="#progress-indicator"
            hx-include="#advanced-search-form">
          <span class="icon is-small"><i class="iconify" data-icon="mdi-chevron-right"></i></span>
        </button>
      {% else %}
        <button class="button is-small px-2" disabled>
          <span class="icon is-small"><i class="iconify" data-icon="mdi-chevron-right"></i></span>
        </button>
      {% endif %}
    </div>
  </div>
</div>
