{% for actiongroup in record.get_actions(status,current_actor,section,panel,True) %}
  <span class="">
    {% for action in actiongroup.items %}
      <button class="button is-ghost px-1 is-small has-tooltip-arrow" data-tooltip="{{ action.title }}"
        {% for attr in action.attr %}
          {% if attr in ['hx-get','hx-post'] %}
            {{ attr }}="{{ action.attr[attr] }}&record_id={{ record.id }}&recordactor_id={{ is_true(status,'id') }}&section={{section}}&panel={{panel}}&loop_index={{loop.index}}"
          {% else %}
            {{ attr }}="{{ action.attr[attr] }}"
          {% endif %}
        {% endfor %}
      >
        <i class="iconify {{ action.extra_class }}" data-width="1.2em" data-icon="{{ action.icon }}"></i>
      </button>
    {% endfor %}
  </span>
{% endfor %}
