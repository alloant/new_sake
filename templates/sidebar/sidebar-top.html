<div id="logo-search">
  <!-- Here logo -->
  <div class="item is-flex is-justify-content-space-between p-1" style="width: 100%;">
    <img class="logo" src="{{ url_for('static', path='icons/sake_long.svg') }}" alt="logo" />
    <a  class="button has-tooltip-arrow has-tooltip-left flex-shrink"
        data-tooltip="Settings"
        href="settings">
        <span class="iconify" data-icon="mdi-cog"></span>
    </a>
  </div>

  <!-- Here universal search bar -->
  <div class="item control has-icons-left mx-1" style="width: 100%;">
    <input class="input is-mediumish is-rounded" type="search" placeholder="Search" name="all_search" id="all_search"
          hx-post="/global_search?section={{section}}&panel={{panel}}"
          hx-trigger="input changed delay:500ms, search"
          hx-target="#main-table"/>
    <span class="icon is-small is-left"><i class="iconify" data-icon="mdi-magnify"></i></span>
  </div>
</div>

<div id="sidebar-top_control_menu">
  <div id="sidebar-top_control" class="sidebar-top_control">
    {% include 'sidebar/sidebar-top_control.html' %}
  </div>

  <div id="sidebar-top_menu">
    {% include 'sidebar/sidebar-top_menu.html' %}
  </div>
</div>
