<aside class="menu p-2">
{% for group in sidebar['panel'] %}
  <div class="level is-mobile p-0 m-0">
    <div class="level-left">
      <p class="menu-label has-text-weight-bold mb-0">{{_(group['title'])}}</p>
    </div>
    <div class="level-right">
      {% if section == 'cl' %}
      <a class="button is-small is-responsive is-text has-tooltip-arrow has-tooltip-left"
        hx-get="/settings_ctr?section={{section}}&panel={{panel}}"
        hx-target="#modal-content-target"
        onclick="openModal()"
        title="Settings ctr">
        <i class="iconify is-small" data-icon="mdi:cog"></i>
      </a>
      {% endif %}
    </div>
  </div>

  <ul class="menu-list">

  {% for item in group.items %}
    <li class="">
      <a  class="menu-link is-inline-flex is-justify-content-space-between is-align-items-center {{ item.active }}" 
          href="{{ item.link }}">
        <span>
          <i class="iconify" data-icon="{{ item.icon }}"></i>
          {{_(item.title)}}
        </span>
        {% if item.show_count %}
          {% if section == 'sccr' %}
            <div  hx-get="/sccr/number?section={{section}}&panel={{item.id}}"
              hx-trigger="load{{item.hx_trigger}}"
              hx-indicator="#progress-indicator">
            </div>
          {% else %}
            <div  hx-get="/records/number?section={{section}}&panel={{item.id}}"
              hx-trigger="load{{item.hx_trigger}}"
              hx-indicator="#progress-indicator">
            </div>
          {% endif%}
        {% endif %}
      </a>
    </li>
  {% endfor %}

  </ul>
{% endfor %}
</aside>
