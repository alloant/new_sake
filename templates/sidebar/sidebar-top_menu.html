<aside class="menu p-2">
{% for group in sidebar['panel'] %}
  <p class="menu-label has-text-weight-bold mb-0">{{group['title']}}</p>
  <ul class="menu-list">

  {% for item in group.items %}
    <li>
      <a  class="menu-link {{ item.active }}" 
          href="{{ item.link }}">
        <i class="iconify" data-icon="{{ item.icon }}"></i>
        {{ item.title }}
      </a>
    </li>
  {% endfor %}

  </ul>
{% endfor %}
</aside>
